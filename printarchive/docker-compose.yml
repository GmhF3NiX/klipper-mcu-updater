services:
  printarchive:
    build: .
    container_name: printarchive
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - PUID=99          # unraid: 99 = 'nobody', anpassen falls nötig
      - PGID=100          # unraid: 100 = 'users'
      - RESCAN_INTERVAL_MINUTES=15
    volumes:
      - /mnt/user/3D Printing/STL:/library  # <- deinen unraid share hier eintragen (primäre Bibliothek)
      - /mnt/user:/hostshares:ro            # read-only, damit im UI weitere Ordner (z.B. andere Shares) hinzufügbar sind
      - ./config:/config                    # DB + Thumbnail-Cache, persistent
