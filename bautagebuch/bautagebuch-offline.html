<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080a">
<title>Bautagebuch EG (offline)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<script>
/* Offline-Speicher für das Bautagebuch: bildet die claude.ai-Schnittstellen
   (db, assets, downloads, user) mit IndexedDB im Browser nach. */
(() => {
  const DB_NAME = 'bautagebuch-eg', VERSION = 1;
  const docs = new Map();          // "coll/id" -> {c, id, data}
  const blobs = new Map();         // id -> {type, url}
  const collSubs = new Set();      // {c, next}
  const docSubs = new Set();       // {key, next}
  let idb = null;

  const clone = v => JSON.parse(JSON.stringify(v));
  const rid = (n = 20) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => (b % 36).toString(36)).join('');
  const hex32 = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  const meta = { fromCache: false, hasPendingWrites: false };
  const snap = (id, data) => ({ id, exists: data !== undefined, data: () => data, metadata: meta });

  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, VERSION);
      r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const all = store => new Promise((res, rej) => {
    const out = []; const r = idb.transaction(store).objectStore(store).openCursor();
    r.onsuccess = () => { const c = r.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
    r.onerror = () => rej(r.error);
  });

  function querySnap(c) {
    const list = [...docs.values()].filter(d => d.c === c).sort((a, b) => a.id.localeCompare(b.id));
    const ds = list.map(d => snap(d.id, d.data));
    return { docs: ds, size: ds.length, empty: !ds.length, metadata: meta, docChanges: () => [] };
  }
  function notify(c, key) {
    queueMicrotask(() => {
      collSubs.forEach(s => { if (s.c === c) s.next(querySnap(c)); });
      docSubs.forEach(s => { if (s.key === key) { const d = docs.get(key); s.next(snap(key.split('/').pop(), d && d.data)); } });
    });
  }
  async function write(c, id, data) {
    const key = c + '/' + id;
    if (data === undefined) { docs.delete(key); await tx('docs', 'readwrite', s => s.delete(key)); }
    else { const v = { c, id, data: Object.freeze(clone(data)) }; docs.set(key, v); await tx('docs', 'readwrite', s => s.put({ c, id, data: v.data }, key)); }
    notify(c, key);
  }

  function docRef(c, id) {
    const key = c + '/' + id;
    return {
      id, path: key,
      get: async () => snap(id, docs.get(key) && docs.get(key).data),
      set: data => write(c, id, data),
      update: async data => {
        const cur = docs.get(key);
        if (!cur) throw { code: 'invalid_argument', message: 'Dokument existiert nicht' };
        await write(c, id, Object.assign(clone(cur.data), clone(data)));
      },
      delete: () => write(c, id, undefined),
      onSnapshot(next) {
        const s = { key, next }; docSubs.add(s);
        queueMicrotask(() => { const d = docs.get(key); next(snap(id, d && d.data)); });
        return () => docSubs.delete(s);
      },
      collection: sub => collRef(key + '/' + sub),
      acquire: async () => ({ acquired: true }),
    };
  }
  function collRef(c) {
    const q = {
      path: c,
      doc: id => docRef(c, id || rid()),
      add: async data => { const r = docRef(c, rid()); await r.set(data); return r; },
      where: () => q, orderBy: () => q, limit: () => q,
      get: async () => querySnap(c),
      onSnapshot(next) {
        const s = { c, next }; collSubs.add(s);
        queueMicrotask(() => next(querySnap(c)));
        return () => collSubs.delete(s);
      },
    };
    return q;
  }
  const db = {
    collection: collRef,
    doc: path => { const i = path.lastIndexOf('/'); return docRef(path.slice(0, i), path.slice(i + 1)); },
  };

  const assets = {
    async upload(blob, opts) {
      const type = (opts && opts.type) || blob.type || 'application/octet-stream';
      const id = hex32();
      await tx('blobs', 'readwrite', s => s.put({ type, blob }, id));
      const url = URL.createObjectURL(blob);
      blobs.set(id, { type, url });
      return { id, url, sizeBytes: blob.size, contentType: type };
    },
    async delete(id) {
      const had = blobs.has(id);
      if (had) URL.revokeObjectURL(blobs.get(id).url);
      blobs.delete(id); await tx('blobs', 'readwrite', s => s.delete(id));
      return { deleted: had };
    },
    async list() {
      return { assets: [...blobs.entries()].map(([id, b]) => ({ id, url: b.url, contentType: b.type, sizeBytes: 0, createdAt: '' })), usage: { files: blobs.size, bytes: 0, maxFiles: 1e9, maxBytes: 1e12 } };
    },
  };

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return { status: 'saved' };
    },
  };
  const user = { isOwner: () => true, canEdit: () => true, can: () => true, id: async () => 'offline', me: async () => ({ id: 'offline', name: '' }) };

  const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  async function exportBackup() {
    const out = { app: 'bautagebuch-eg', version: 1, exported: new Date().toISOString(), docs: [], blobs: [] };
    docs.forEach(d => out.docs.push({ c: d.c, id: d.id, data: d.data }));
    for (const [id, v] of await all('blobs')) out.blobs.push({ id, type: v.type, data: await b64(v.blob) });
    const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    await downloads.save({ filename: `Bautagebuch-Backup-${stamp}.json`, data: new Blob([JSON.stringify(out)], { type: 'application/json' }) });
    return true;
  }
  async function importBackup(file) {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'bautagebuch-eg' || !Array.isArray(j.docs)) throw new Error('keine Bautagebuch-Sicherung');
    for (const b of j.blobs || []) {
      const bin = Uint8Array.from(atob(b.data), ch => ch.charCodeAt(0));
      const blob = new Blob([bin], { type: b.type });
      await tx('blobs', 'readwrite', s => s.put({ type: b.type, blob }, b.id));
      if (blobs.has(b.id)) URL.revokeObjectURL(blobs.get(b.id).url);
      blobs.set(b.id, { type: b.type, url: URL.createObjectURL(blob) });
    }
    for (const d of j.docs) await write(d.c, d.id, d.data);
    return j.docs.length;
  }

  const ready = (async () => {
    idb = await open();
    for (const [key, v] of await all('docs')) docs.set(key, { c: v.c, id: v.id, data: Object.freeze(v.data) });
    for (const [id, v] of await all('blobs')) blobs.set(id, { type: v.type, url: URL.createObjectURL(v.blob) });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  })();

  const caps = { db, assets, downloads, user };
  window.__offline = { blobUrl: id => (blobs.get(id) || {}).url || '', exportBackup, importBackup };
  window.claude = { use: async name => { try { await ready; } catch (e) { return null; } return caps[name] || null; } };
})();

</script>
</head>
<body>
<style>
:root{
  color-scheme:dark;
  --bg:#06080a; --surface:#131a21; --sunk:#10161c; --ink:#e7eef2; --muted:#798794; --line:#212a33;
  --accent:#f0575a; --accent-ink:#ffffff; --blue:#17e0f0; --ok:#3ee08f; --warn:#fbbf24; --bad:#ff4d6d;
  --ok-bg:rgba(62,224,143,.12); --warn-bg:rgba(251,191,36,.12); --bad-bg:rgba(255,77,109,.12);
  --display:"Orbitron", "Arial Black", system-ui, sans-serif;
  --body:"Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:9px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 16px 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 30px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ruler{height:10px;margin-top:12px;background:
  repeating-linear-gradient(90deg,var(--accent-ink) 0 1px,transparent 1px 10px) bottom/100% 4px no-repeat,
  repeating-linear-gradient(90deg,var(--accent-ink) 0 1px,transparent 1px 50px) bottom/100% 7px no-repeat,
  repeating-linear-gradient(90deg,var(--accent) 0 100px,#F7D35A 100px 200px);
  border-radius:2px;opacity:.95}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font:600 17px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font:500 11px var(--mono);margin-left:4px;color:var(--muted)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.view{display:grid;gap:20px}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font:600 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px;min-height:32px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:500 24px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
.budget{margin-top:6px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.budget i{display:block;height:100%;background:var(--accent)}
.budget i.over{background:var(--bad)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Listen */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-h .ttl{font-weight:600;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--ink);font-size:12px;font-weight:500}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.Bestellt{background:var(--warn-bg);color:var(--warn)}
.pill.Geliefert{background:var(--sunk);color:var(--blue)}
.pill.Bezahlt{background:var(--ok-bg);color:var(--ok)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.links a{overflow-wrap:anywhere}
.day{font:600 14px var(--mono);color:var(--muted);margin:8px 0 -4px;display:flex;gap:10px;align-items:center}
.day::after{content:"";flex:1;height:1px;background:var(--line)}

.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:84px;height:84px;border-radius:4px;border:1px solid var(--line);overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0;text-decoration:none;color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .doc{font:600 12px var(--mono);text-align:center;padding:4px;overflow-wrap:anywhere;font-size:11px}
.thumb .doc b{display:block;font:700 16px var(--display);color:var(--bad)}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:22px;padding:0;font-size:14px}

.money{font:500 17px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select{min-width:0}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

details summary{cursor:pointer;color:var(--muted);font-size:13px}

/* Räume */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.room-tile{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.room-tile[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.room-tile .n{font:700 20px var(--display);text-transform:uppercase}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dims div{background:var(--surface);padding:10px 12px}
.dims .k{font-size:12px;color:var(--muted)}
.dims .v{font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.iso{width:100%;max-width:100%;height:300px;display:block;background:var(--sunk);border-radius:var(--r);touch-action:none;cursor:grab}
.iso-cap{font-size:12px;color:var(--muted);margin-top:6px}

.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Installation */
.plan-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plan-chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:14px}
.plan-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);max-height:75vh}
.stage{position:relative;min-width:100%}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.stage.placing{cursor:crosshair;outline:3px solid var(--accent);outline-offset:-3px}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;padding:0 6px;border-radius:14px;border:2px solid #fff;color:#fff;font:600 12px/24px var(--mono);text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin[aria-current="true"]{outline:3px solid var(--accent);outline-offset:1px;z-index:2}
.kdot{display:inline-block;min-width:24px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font:600 11px/22px var(--mono);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 10px 2px 3px;cursor:pointer;font-size:13px}
.legend button[aria-pressed="false"]{opacity:.45}
.pt-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.pt-row[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hint{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:8px 10px}

/* Termine */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-head .mon{font:700 22px var(--display);text-transform:uppercase;letter-spacing:.03em;min-width:170px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:320px}
.cal .h{background:var(--sunk);font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0}
.cal .kw{background:var(--sunk);font:500 11px var(--mono);color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.cal .d{background:var(--surface);border:0;min-height:74px;padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;border-radius:0}
.cal .d.out{background:var(--bg);color:var(--muted)}
.cal .d .n{font:500 13px var(--mono)}
.cal .d.today .n{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 6px;align-self:flex-start}
.cal .d[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}
.cal .d.we{background:color-mix(in srgb,var(--surface) 88%,var(--sunk))}
.ev-l{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-l.done{opacity:.5;text-decoration:line-through}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.diary-mark{font-size:10px;color:var(--muted)}
@media (max-width:640px){.cal .dm-t{display:none}.cal .d{min-height:52px}.cal .d .ev-l{display:none}.cal .d .dots{display:flex}}
.ev-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.ev-date{font:500 13px var(--mono);text-align:center;min-width:52px;padding:4px 6px;border-radius:4px;background:var(--sunk)}
.ev-date b{display:block;font:700 20px var(--display)}
.ev-done{text-decoration:line-through;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px}
/* Kontakte */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14px}

.search{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0;flex:1 1 180px;max-width:320px}

/* Notizen */
.qn{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.qn-row{display:flex;gap:8px;flex-wrap:wrap}
.qn-row textarea{flex:1 1 240px;min-height:44px;max-height:180px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px;color:var(--ink);font-size:16px}
.qn-row select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:8px;color:var(--ink);max-width:100%}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.note .actions{grid-column:2;margin:-4px 0 -6px -8px}
.note.wichtig{border-left:4px solid var(--bad)}
.note.done .nt{text-decoration:line-through;color:var(--muted)}
.note input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.note .ico{width:20px;text-align:center;font-size:15px;margin-top:1px}
.nt{white-space:pre-wrap;overflow-wrap:anywhere}
.star{border:0;background:none;cursor:pointer;font-size:17px;color:var(--muted);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--bad)}
.nsec{display:grid;gap:8px}

/* Formular-Sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,15,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}

form.f{display:grid;gap:14px}

.fl input,.fl select,.fl textarea,.rows input,.filters select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:8px 10px;width:100%;color:var(--ink);font-size:15px}

<script>
(() => {
const TABS = ['uebersicht','notizen','termine','tagebuch','belege','raeume','install','kontakte'];
const CATS = ['Material','Werkzeug & Leihgeräte','Handwerker','Entsorgung','Sonstiges'];
const STATUS = ['Bestellt','Geliefert','Bezahlt'];
const EUR = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const NUM = new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});
const DATE = new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});

const S = {notes:[],nt:{type:'todo',filter:'',room:'',qroom:'',showDone:false},events:[],contacts:[],cal:{month:null,sel:null},ct:{q:'',trade:''},points:[],inst:{room:null,plan:null,zoom:1,placing:false,move:null,sel:null,hide:[]},rooms:[],entries:[],costs:[],meta:{},tab:'uebersicht',room:null,filter:{room:'',cat:'',status:''},loaded:{rooms:false,entries:false,costs:false}};
let db=null, assets=null, downloads=null, canWrite=true;

const $ = (s,r=document)=>r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const num = v => { if(v==null) return null; let s=String(v).trim(); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?n:null; };
const fmtN = v => v==null||v==='' ? '' : NUM.format(v);
const fmtD = d => { if(!d) return ''; const x=new Date(d+'T12:00:00'); return isNaN(x)?d:DATE.format(x); };
const url = u => { u=String(u||'').trim(); if(!u) return ''; return /^https?:\/\//i.test(u)?u:'https://'+u; };
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } };
const roomName = id => (S.rooms.find(r=>r.id===id)||{}).name || 'Allgemein / EG';
const costAmount = c => { const a=num(c.amount); if(a!=null) return a; return (c.items||[]).reduce((s,i)=>s+(num(i.qty)||0)*(num(i.price)||0),0); };
const blobUrl = id => (window.__offline ? window.__offline.blobUrl(id) : '/_blob/'+id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- Tabs ---------- */
function setTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach(b=>{ b.setAttribute('aria-selected', b.dataset.tab===t ? 'true':'false'); if(b.dataset.tab===t&&b.scrollIntoView) try{ b.scrollIntoView({block:'nearest',inline:'nearest'}); }catch{} });
  TABS.forEach(v=>$('#v-'+v).hidden = v!==t);
  try{ localStorage.setItem('bt-tab',t); }catch{}
}
(function initialTab(){
  let t = (location.hash||'').slice(1);
  if(!TABS.includes(t)){ try{ t=localStorage.getItem('bt-tab')||''; }catch{} }
  setTab(TABS.includes(t)?t:'uebersicht');
})();

/* ---------- Render ---------- */
function render(){
  const m=S.meta||{};
  $('#p-name').textContent = m.name || 'Bautagebuch EG';
  $('#p-sub').textContent = m.subtitle || 'Umbau Zweifamilienhaus → Einfamilienhaus · Erdgeschoss';
  $('#c-tagebuch').textContent = S.entries.length||'';
  $('#c-belege').textContent = S.costs.length||'';
  $('#c-raeume').textContent = S.rooms.length||'';
  $('#btn-meta').hidden = !db || !canWrite;
  $('#c-install').textContent = S.points.length||'';
  const up=S.events.filter(e=>e.date>=today()&&!e.done).length;
  $('#c-termine').textContent = up||''; $('#c-kontakte').textContent = S.contacts.length||'';
  renderOverview(); renderDiary(); renderCosts(); renderRooms(); renderInstall(); renderCal(); renderContacts(); renderNotes();
  $('#c-notizen').textContent = openTodos().length||'';
}

function statTile(k,v,s='',extra=''){ return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}${extra}</div>`; }

function bars(rows){
  const max=Math.max(...rows.map(r=>r[1]),0);
  if(!max) return `<p class="muted small">Noch keine Kosten erfasst.</p>`;
  return `<div class="bars">${rows.filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<div class="bar"><span class="lbl" title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${Math.max(2,v/max*100)}%"></i></span><span class="num small">${EUR.format(v)}</span></div>`).join('')}</div>`;
}

function renderOverview(){
  const el=$('#v-uebersicht');
  const total=S.costs.reduce((s,c)=>s+costAmount(c),0);
  const open=S.costs.filter(c=>c.status!=='Bezahlt');
  const openSum=open.reduce((s,c)=>s+costAmount(c),0);
  const labor=S.costs.reduce((s,c)=>s+(num(c.labor)||0),0);
  const hours=S.entries.reduce((s,e)=>s+(num(e.hours)||0),0);
  const budget=num(S.meta.budget);
  let budgetTile;
  if(budget){
    const pct=total/budget*100;

function sortEntries(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); }

function fileThumbs(files,removable=false){
  if(!files||!files.length) return '';
  return `<div class="thumbs">${files.map((f,i)=>{
    const src=blobUrl(f.id);
    const isImg=(f.type||'').startsWith('image/');
    const inner=isImg?`<img src="${src}" alt="${esc(f.name)}" loading="lazy">`:`<span class="doc"><b>${esc((f.name||'').split('.').pop().toUpperCase()||'DATEI')}</b>${esc((f.name||'').slice(0,28))}</span>`;
    const x=removable?`<button type="button" class="x" data-act="rm-file" data-i="${i}" aria-label="Entfernen">×</button>`:'';
    return isImg?`<button type="button" class="thumb" data-act="lightbox" data-src="${src}" title="${esc(f.name)}">${inner}${x}</button>`
                :`<a class="thumb" href="${src}" target="_blank" rel="noopener" title="${esc(f.name)}">${inner}${x}</a>`;
  }).join('')}</div>`;
}
function linkList(links){
  const l=(links||[]).filter(x=>x&&x.url);
  if(!l.length) return '';
  return `<div class="links">${l.map(x=>`<a href="${esc(url(x.url))}" target="_blank" rel="noopener">↗ ${esc(x.label||host(url(x.url)))}</a>`).join('')}</div>`;
}
function rowActions(kind,id){
  if(!db||!canWrite) return '';
  return `<div class="actions"><button class="btn ghost small" data-act="edit-${kind}" data-id="${esc(id)}">Bearbeiten</button><button class="btn ghost small danger" data-act="del-${kind}" data-id="${esc(id)}">Löschen</button></div>`;
}

function roomCalc(r){
  const L=num(r.L),W=num(r.W),H=num(r.H);
  if(!L||!W) return null;
  const A=L*W, U=2*(L+W);
  const op=(r.openings||[]).reduce((s,o)=>s+(num(o.w)||0)*(num(o.h)||0)*(num(o.n)||1),0);
  const wall=H?U*H:null;
  return {L,W,H,A,U,op,wall,net:wall!=null?wall-op:null,V:H?A*H:null};
}

/* ---------- Installation ---------- */
const KINDS=[
  ['steckdose','Steckdose','SD','#D97F00'],['schalter','Schalter','SW','#B45F06'],['licht','Lichtauslass','L','#B89600'],
  ['elektro','Elektroleitung / Abzweigdose','E','#7D5200'],['netz','Netzwerk / TV / Telefon','N','#7A4FC2'],
  ['kw','Wasser kalt','KW','#1F78C8'],['ww','Wasser warm','WW','#CC3029'],['aw','Abwasser','AW','#6B5A48'],
  ['heizung','Heizung','H','#E0563A'],['sonst','Sonstiges','?','#56666B']];
const kind=k=>KINDS.find(x=>x[0]===k)||KINDS[KINDS.length-1];
const kdot=(k,label)=>{ const d=kind(k); return `<span class="kdot" style="background:${d[3]}">${esc(label??d[2])}</span>`; };

function stageClick(ev){
  const I=S.inst, st=$('#stage'); if(!I.placing||!st) return false;
  if(ev.target.closest('.pin')) return false;
  const b=st.getBoundingClientRect();
  const x=Math.round((ev.clientX-b.left)/b.width*1000)/10, y=Math.round((ev.clientY-b.top)/b.height*1000)/10;
  if(x<0||x>100||y<0||y>100) return false;
  I.placing=false;
  if(I.move){
    const id=I.move; I.move=null;
    db.collection('install').doc(id).update({planId:I.plan,x,y}).then(()=>toast('Position gespeichert')).catch(()=>toast('Speichern fehlgeschlagen'));
    renderInstall();
  } else pointForm({roomId:I.room,planId:I.plan,x,y});
  return true;
}

function icsFor(list){
  const x=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const dt=(d,t)=>d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');
  const next=d=>{ const n=new Date(d+'T12:00:00'); n.setDate(n.getDate()+1); return isoD(n); };
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=list.map(e=>{
    const start=e.time?`DTSTART:${dt(e.date,e.time)}`:`DTSTART;VALUE=DATE:${dt(e.date)}`;
    const end=e.time?`DTEND:${dt(e.date,e.timeEnd||(String(Math.min(23,+e.time.slice(0,2)+1)).padStart(2,'0')+e.time.slice(2)))}`:`DTEND;VALUE=DATE:${dt(next(e.date))}`;
    const desc=[ekind(e.kind)[1],e.contactId&&contactName(e.contactId),e.note].filter(Boolean).join('\n');
    return ['BEGIN:VEVENT',`UID:${e.id}@bautagebuch-eg`,`DTSTAMP:${stamp}`,start,end,`SUMMARY:${x(e.title)}`,desc?`DESCRIPTION:${x(desc)}`:'',e.roomId?`LOCATION:${x(roomName(e.roomId))}`:'','END:VEVENT'].filter(Boolean).join('\r\n');
  });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bautagebuch EG//DE','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n')+'\r\n';
}
async function saveIcs(list,name){
  try{ const r=await downloads.save({filename:name,data:new Blob([icsFor(list)],{type:'text/calendar'})}); if(r&&r.status==='saved') toast('Kalenderdatei gespeichert – zum Importieren öffnen'); }
  catch(e){ if(e&&e.code!=='cancelled'&&e.code!=='declined') toast('Export nicht möglich'); }
}

/* ---------- 3D-Raum ---------- */
const iso={yaw:-0.7,pitch:0.55};
function initIso(cv,r,c){
  const draw=()=>drawIso(cv,r,c);
  let drag=null;
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw:iso.yaw,pitch:iso.pitch};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';};
  cv.onpointermove=e=>{ if(!drag) return; iso.yaw=drag.yaw+(e.clientX-drag.x)*0.01; iso.pitch=Math.max(0.1,Math.min(1.35,drag.pitch+(e.clientY-drag.y)*0.006)); draw(); };
  cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab';};
  draw();
  if(!initIso.ro){ initIso.ro=new ResizeObserver(()=>{ const x=$('#iso'); if(x&&x._draw) x._draw(); }); }
  cv._draw=draw; initIso.ro.observe(cv);
}
function drawIso(cv,r,c){
  const cs=getComputedStyle(document.documentElement);
  const col=k=>cs.getPropertyValue(k).trim();
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const {L,W,H}=c, cy=Math.cos(iso.yaw), sy=Math.sin(iso.yaw), cp=Math.cos(iso.pitch), sp=Math.sin(iso.pitch);
  const P=(x,y,z)=>{ x-=L/2; y-=W/2; z-=H/2; const rx=x*cy-y*sy, ry=x*sy+y*cy; return {x:rx, y:-z*cp+ry*sp, d:ry*cp+z*sp}; };
  const corners=[]; for(const x of[0,L])for(const y of[0,W])for(const z of[0,H])corners.push(P(x,y,z));
  const minX=Math.min(...corners.map(p=>p.x)),maxX=Math.max(...corners.map(p=>p.x)),minY=Math.min(...corners.map(p=>p.y)),maxY=Math.max(...corners.map(p=>p.y));
  const s=Math.min((w-60)/(maxX-minX),(h-50)/(maxY-minY));
  const T=p=>[w/2+(p.x-(minX+maxX)/2)*s, h/2+(p.y-(minY+maxY)/2)*s];
  const poly=(pts,fill,stroke,alpha=1)=>{ g.beginPath(); pts.map(p=>T(p)).forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); if(fill){g.globalAlpha=alpha;g.fillStyle=fill;g.fill();g.globalAlpha=1;} if(stroke){g.strokeStyle=stroke;g.lineWidth=1.2;g.stroke();} };
  const walls=[
    {pts:[[0,0],[L,0]],n:[0,-1]},{pts:[[L,0],[L,W]],n:[1,0]},{pts:[[L,W],[0,W]],n:[0,1]},{pts:[[0,W],[0,0]],n:[-1,0]}
  ].map(wl=>{ const [a,b]=wl.pts; const q=[P(a[0],a[1],0),P(b[0],b[1],0),P(b[0],b[1],H),P(a[0],a[1],H)]; return {...wl,q,d:q.reduce((s,p)=>s+p.d,0)/4}; });
  walls.sort((a,b)=>b.d-a.d);
  const ops=[]; (r.openings||[]).forEach(o=>{ for(let i=0;i<Math.min(6,num(o.n)||1);i++) ops.push(o); });
  const glow=(c,b)=>{ g.shadowColor=c; g.shadowBlur=b; };
  // hintere Wände mit Öffnungen
  walls.slice(0,2).forEach((wl,wi)=>{
    glow(col('--blue'),8); poly(wl.q,col('--sunk'),col('--blue'),0.95); glow('transparent',0);
    const [a,b]=wl.pts; const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    let pos=0.4;
    ops.filter((_,i)=>i%2===wi).forEach(o=>{
      const ow=num(o.w)||1, oh=Math.min(H-0.05,num(o.h)||1);
      if(pos+ow>len-0.2) return;
      const isDoor=/tür|tuer|door/i.test(o.name||'')||oh>H*0.7;
      const z0=isDoor?0:Math.max(0,Math.min(0.9,H-oh-0.3));
      const pt=(t,z)=>P(a[0]+(b[0]-a[0])*t/len,a[1]+(b[1]-a[1])*t/len,z);
      glow(col('--accent'),10); poly([pt(pos,z0),pt(pos+ow,z0),pt(pos+ow,z0+oh),pt(pos,z0+oh)],col('--accent'),col('--accent'),0.22); glow('transparent',0);
      pos+=ow+0.5;
    });
  });
  // Boden mit 1-m-Raster
  poly([P(0,0,0),P(L,0,0),P(L,W,0),P(0,W,0)],col('--blue'),null,0.10);
  g.strokeStyle=col('--blue'); g.globalAlpha=0.28; g.lineWidth=1;
  for(let x=1;x<L;x++){ const [a,b]=[T(P(x,0,0)),T(P(x,W,0))]; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
  for(let y=1;y<W;y++){ const [a,b]=[T(P(0,y,0)),T(P(L,y,0))]; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
  g.globalAlpha=1;
  // vordere Wände nur als Neon-Kanten
  glow(col('--blue'),12);
  walls.slice(2).forEach(wl=>poly(wl.q,col('--blue'),col('--blue'),0.04));
  poly([P(0,0,0),P(L,0,0),P(L,W,0),P(0,W,0)],null,col('--blue'));
  glow('transparent',0);
  // Kanten + Maße
  g.fillStyle=col('--ink'); g.font='13px "Share Tech Mono", monospace'; g.textAlign='center'; g.textBaseline='middle';
  const lab=(p1,p2,txt,off)=>{ const [x1,y1]=T(p1),[x2,y2]=T(p2); g.fillText(txt,(x1+x2)/2+off[0],(y1+y2)/2+off[1]); };
  const front=walls[walls.length-1], side=walls[walls.length-2];
  lab(P(front.pts[0][0],front.pts[0][1],0),P(front.pts[1][0],front.pts[1][1],0),NUM.format(Math.hypot(front.pts[1][0]-front.pts[0][0],front.pts[1][1]-front.pts[0][1]))+' m',[0,14]);
  lab(P(side.pts[0][0],side.pts[0][1],0),P(side.pts[1][0],side.pts[1][1],0),NUM.format(Math.hypot(side.pts[1][0]-side.pts[0][0],side.pts[1][1]-side.pts[0][1]))+' m',[0,14]);
  const shared=front.pts.find(p=>side.pts.some(q=>q[0]===p[0]&&q[1]===p[1]))||front.pts[0];
  lab(P(shared[0],shared[1],0),P(shared[0],shared[1],H),NUM.format(H)+' m',[-26,0]);
}

function rowsField(name,legend,cols,values){
  const tpl=cols.map(c=>c.w).join(' ')+' 30px';
  const row=v=>`<div class="row" style="grid-template-columns:${tpl}">${cols.map(c=>`<input data-k="${c.k}" value="${esc(c.num&&v[c.k]!=null?String(v[c.k]).replace('.',','):v[c.k]??'')}" placeholder="${esc(c.label)}" aria-label="${esc(c.label)}"${c.num?' inputmode="decimal"':''}>`).join('')}<button type="button" class="rm" data-act="rm-row" aria-label="Zeile entfernen">×</button></div>`;

}
function readRows(name){
  const box=$(`[data-rows="${name}"]`); if(!box) return [];
  const cols=JSON.parse(box.dataset.tpl);
  return [...box.querySelectorAll('.row')].map(r=>{ const o={}; cols.forEach(c=>{ const v=r.querySelector(`[data-k="${c.k}"]`).value.trim(); o[c.k]=c.num?num(v):v; }); return o; })
    .filter(o=>cols.some(c=>o[c.k]!=null&&o[c.k]!==''));

// Datei-Anhänge
let formFiles=null;
function filesField(existing,label){
  formFiles={list:[...(existing||[])],added:[],removed:[]};
  if(!assets) return `<fieldset><legend>${label}</legend>${fileThumbs(formFiles.list)}<p class="muted small">Hochladen ist in dieser Ansicht nicht möglich (nur mit Bearbeitungsrecht).</p></fieldset>`;
  return `<fieldset><legend>${label}</legend><div id="ff-thumbs">${fileThumbs(formFiles.list,true)}</div><div class="upl"><input type="file" id="ff-input" multiple accept="image/*,application/pdf"><span class="small muted" id="ff-state"></span></div></fieldset>`;
}
async function shrink(file,max=2000){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<2.5e6&&file.type!=='image/heic') return file;
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    return blob? new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}) : file;
  }catch{ return file; }
}
async function handleFiles(input){
  const st=$('#ff-state'); const files=[...input.files]; input.value='';
  for(let i=0;i<files.length;i++){
    st.textContent=`Lade hoch ${i+1}/${files.length} …`;
    try{
      const f=await shrink(files[i]);
      const type=f.type|| (/\.pdf$/i.test(f.name)?'application/pdf':'');
      const res=await assets.upload(f,type?{type}:undefined);
      const rec={id:res.id,name:f.name,type:res.contentType};
      formFiles.list.push(rec); formFiles.added.push(res.id);
      $('#ff-thumbs').innerHTML=fileThumbs(formFiles.list,true);
    }catch(e){
      const m={too_large:'Datei zu groß (max. 20 MB).',unsupported_type:'Dateityp nicht unterstützt – bitte Foto (JPG/PNG) oder PDF.',quota_or_state:'Speicherplatz voll.',rate_limited:'Zu viele Uploads auf einmal – kurz warten.'}[e&&e.code];
      st.textContent=''; toast(m||('Upload fehlgeschlagen: '+(e&&e.message||e)));
    }
  }
  st.textContent='';
}
async function finishFiles(saved){
  if(!formFiles||!assets) return;
  const drop = saved ? formFiles.removed : formFiles.added;
  for(const id of drop){ try{ await assets.delete(id); }catch{} }
  formFiles=null;
}

}

    ${S.contacts.length?sel('c-contact','Kontakt / Firma',[['','– kein Kontakt –'],...S.contacts.map(k=>[k.id,contactName(k.id)])],c.contactId??''):''}
    ${fld('c-link','Link zur Bestellung',c.link,{ph:'https://…',wide:true,type:'url'})}
    ${area('c-note','Notiz',c.note,'z. B. Lieferung erwartet am …, Rückgabe bis …')}
  `,{onCancel:()=>finishFiles(false),onSave:async()=>{
    const items=readRows('c-items');
    const data={date:$('#c-date').value||today(),vendor:$('#c-vendor').value.trim(),title:$('#c-title').value.trim(),roomId:$('#c-room').value,category:$('#c-cat').value,status:$('#c-status').value,
      amount:num($('#c-amount').value),labor:num($('#c-labor').value),items,files:formFiles?formFiles.list:(c.files||[]),link:$('#c-link').value.trim(),note:$('#c-note').value.trim(),contactId:$('#c-contact')?$('#c-contact').value:(c.contactId||''),createdAt:c.createdAt||Date.now(),updatedAt:Date.now()};
    if(!data.vendor&&data.contactId){ const k=S.contacts.find(x=>x.id===data.contactId); if(k) data.vendor=k.company||k.name; }
    if(!data.title&&!data.vendor) throw new Error('Bitte Händler oder Bezeichnung angeben.');
    if(data.amount==null&&!items.some(i=>i.qty&&i.price)) throw new Error('Bitte einen Betrag eintragen oder Positionen mit Menge und Preis.');
    await save('costs',c.id,data); await finishFiles(true); toast(isNew?'Beleg gespeichert':'Beleg aktualisiert');
  }});
}

function roomForm(r={}){
  const isNew=!r.id;
  openSheet(isNew?'Neuer Raum':'Raum & Aufmaß bearbeiten', `
    <div class="fr">${fld('r-name','Name',r.name,{ph:'z. B. Küche'})}</div>
    <div class="fr">${numF('r-L','Länge (m)',r.L,'5,20')}${numF('r-W','Breite (m)',r.W,'4,10')}${numF('r-H','Höhe (m)',r.H,'2,50')}</div>
    ${rowsField('r-open','Öffnungen (werden von der Wandfläche abgezogen)',[{k:'name',label:'Tür / Fenster',w:'1.6fr'},{k:'n',label:'Anz.',w:'.6fr',num:true},{k:'w',label:'Breite m',w:'.9fr',num:true},{k:'h',label:'Höhe m',w:'.9fr',num:true}],r.openings)}
    ${rowsField('r-pos','Aufmaß-Positionen',[{k:'text',label:'Leistung',w:'2fr'},{k:'qty',label:'Menge',w:'.8fr',num:true},{k:'unit',label:'Einh.',w:'.7fr'}],r.positions)}
    ${fld('r-model','Link zum 3D-Modell (Fusion-Freigabe)',r.model,{ph:'https://a360.co/…',wide:true,type:'url'})}
    ${rowsField('r-links','Weitere Links',[{k:'label',label:'Bezeichnung',w:'1fr'},{k:'url',label:'https://…',w:'1.6fr'}],r.links)}
    ${area('r-notes','Notizen',r.notes,'Planung, Ideen, Farbtöne …')}
  `,{onSave:async()=>{
    const name=$('#r-name').value.trim(); if(!name) throw new Error('Bitte einen Namen eingeben.');
    const data={name,L:num($('#r-L').value),W:num($('#r-W').value),H:num($('#r-H').value),openings:readRows('r-open'),positions:readRows('r-pos'),model:$('#r-model').value.trim(),links:readRows('r-links'),notes:$('#r-notes').value.trim(),order:r.order??Date.now()};
    const id=r.id||name.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+uid().slice(-4);
    await save('rooms',id,data); S.room=id; toast(isNew?'Raum angelegt':'Raum gespeichert');
  }});
}

function metaForm(){
  const m=S.meta||{};
  openSheet('Projekt & Budget', `
    ${fld('m-name','Projektname',m.name||'Bautagebuch EG',{wide:true})}
    ${fld('m-sub','Untertitel',m.subtitle||'Umbau Zweifamilienhaus → Einfamilienhaus · Erdgeschoss',{wide:true})}
    <div class="fr">${numF('m-budget','Budget gesamt (€)',m.budget,'z. B. 25000')}</div>
    ${window.__offline?`<fieldset><legend>Backup</legend><p class="small muted" style="margin:0">Die Offline-Version speichert nur in diesem Browser. Speichere regelmäßig ein Backup inklusive Fotos. Beim Laden werden die Daten aus dem Backup <b>hinzugefügt</b>: gleiche Einträge werden aktualisiert, nichts wird gelöscht. So könnt ihr auch Daten von zwei Geräten zusammenführen.</p><div class="actions"><button type="button" class="btn" data-act="backup-save">Backup speichern</button><label class="btn" style="cursor:pointer">Backup laden<input type="file" id="backup-input" accept="application/json,.json" hidden></label></div></fieldset>`:''}
  `,{onSave:async()=>{
    await db.doc('meta/projekt').set({name:$('#m-name').value.trim(),subtitle:$('#m-sub').value.trim(),budget:num($('#m-budget').value)});
    toast('Projekt gespeichert');
  }});
}

/* ---------- CSV ---------- */
async function exportCsv(){
  const q=v=>{ v=v==null?'':String(v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const de=n=>n==null?'':String(Math.round(n*100)/100).replace('.',',');
  const head=['Datum','Bezeichnung','Händler','Raum','Kategorie','Status','Betrag brutto','Lohnanteil §35a','Positionen','Link','Notiz','Anhänge'];
  const rows=[...S.costs].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(c=>[c.date,c.title,c.vendor,roomName(c.roomId),c.category,c.status,de(costAmount(c)),de(num(c.labor)),(c.items||[]).map(i=>`${fmtN(num(i.qty))} ${i.unit||''} ${i.name}`.trim()).join(' | '),c.link,c.note,(c.files||[]).map(f=>f.name).join(', ')]);
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
  try{ const r=await downloads.save({filename:`Kosten-${today()}.csv`,data:new Blob([csv],{type:'text/csv'})}); if(r&&r.status==='saved') toast('CSV gespeichert'); }
  catch(e){ if(e&&e.code!=='cancelled'&&e.code!=='declined') toast('Export nicht möglich'); }
}

/* ---------- Events ---------- */
const armed=new Set();
document.addEventListener('click',async ev=>{
  if(stageClick(ev)) return;
  const b=ev.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ setTab(b.dataset.tab); return; }
  const a=b.dataset.act, id=b.dataset.id;
  const find=(arr)=>arr.find(x=>x.id===id);
  if(a==='new-entry') entryForm();
  else if(a==='new-cost') costForm();
  else if(a==='new-room') roomForm();
  else if(a==='edit-entry') entryForm(find(S.entries));
  else if(a==='edit-cost') costForm(find(S.costs));
  else if(a==='edit-room') roomForm(find(S.rooms));
  else if(a==='edit-meta') metaForm();
  else if(a==='pick-room'){ S.room=id; renderRooms(); }
  else if(a==='new-point') pointForm({roomId:S.inst.room});
  else if(a==='edit-point') pointForm(find(S.points));
  else if(a==='pick-point'){ const p=find(S.points); S.inst.sel=S.inst.sel===id?null:id; if(p&&p.planId&&S.inst.sel) S.inst.plan=p.planId; renderInstall(); if(S.inst.sel){ const d=$('#pt-detail'); if(d&&ev.target.closest('.pt-row')) d.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
  else if(a==='pick-plan'){ S.inst.plan=id; S.inst.placing=false; S.inst.move=null; renderInstall(); }
  else if(a==='toggle-place'){ S.inst.placing=!S.inst.placing; if(!S.inst.placing) S.inst.move=null; renderInstall(); }
  else if(a==='move-point'){ const p=find(S.points); if(p&&!p.planId&&!S.inst.plan) return; S.inst.move=id; S.inst.placing=true; if(p&&p.planId) S.inst.plan=p.planId; renderInstall(); toast('Tippe auf die neue Position im Plan'); }
  else if(a==='zoom'){ S.inst.zoom=Math.max(1,Math.min(4,S.inst.zoom+(+b.dataset.d)*0.5)); renderInstall(); }
  else if(a==='toggle-kind'){ const k=b.dataset.k, h=S.inst.hide; S.inst.hide=h.includes(k)?h.filter(x=>x!==k):[...h,k]; renderInstall(); }
  else if(a==='edit-plan') planForm();
  else if(a==='backup-save') window.__offline.exportBackup().then(ok=>ok&&toast('Backup gespeichert')).catch(()=>toast('Backup fehlgeschlagen'));
  else if(a==='qn-type'){ S.nt.type=b.dataset.t; document.querySelectorAll('[data-act=qn-type]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.nt.type)); const ta=$('#qn-text'); ta.placeholder=S.nt.type==='todo'?'Was muss noch gemacht werden?':S.nt.type==='idee'?'Idee festhalten …':'Notiz …'; ta.focus(); }
  else if(a==='n-filter'){ S.nt.filter=b.dataset.f; document.querySelectorAll('[data-act=n-filter]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===S.nt.filter)); renderNoteList(); }
  else if(a==='note-done'){ const n=find(S.notes); if(n) db.collection('notes').doc(id).update({done:b.checked,doneAt:b.checked?Date.now():null}).then(()=>{ if(b.checked) toast('Erledigt ✓'); }).catch(()=>toast('Speichern fehlgeschlagen')); }
  else if(a==='note-prio'){ const n=find(S.notes); if(n) db.collection('notes').doc(id).update({prio:!n.prio}).catch(()=>toast('Speichern fehlgeschlagen')); }
  else if(a==='note-todo'){ db.collection('notes').doc(id).update({type:'todo',done:false}).then(()=>toast('Als Aufgabe übernommen')).catch(()=>toast('Speichern fehlgeschlagen')); }
  else if(a==='edit-note') noteForm(find(S.notes));
  else if(a==='new-event') eventForm({date:b.dataset.d||S.cal.sel||today(),contactId:b.dataset.contact||''});
  else if(a==='edit-event') eventForm(find(S.events));
  else if(a==='pick-day'){ S.cal.sel=b.dataset.d; if(b.dataset.d.slice(0,7)!==S.cal.month) S.cal.month=b.dataset.d.slice(0,7); renderCal(); }
  else if(a==='cal-nav'){ const [y,m]=S.cal.month.split('-').map(Number); S.cal.month=isoD(new Date(y,m-1+(+b.dataset.d),1)).slice(0,7); renderCal(); }
  else if(a==='cal-today'){ S.cal.sel=today(); S.cal.month=today().slice(0,7); renderCal(); }
  else if(a==='ics'){ const e=find(S.events); if(e) saveIcs([e],'Termin-'+e.date+'.ics'); }
  else if(a==='ics-all') saveIcs(S.events.filter(e=>e.date>=today()),'Bautermine.ics');
  else if(a==='new-contact') contactForm();
  else if(a==='edit-contact') contactForm(find(S.contacts));
  else if(a==='goto-contact'){ setTab('kontakte'); S.ct.q=''; S.ct.trade=''; renderContacts(); const c=$('#ct-'+id); if(c){ c.scrollIntoView({block:'center'}); c.style.boxShadow='0 0 0 2px var(--accent)'; setTimeout(()=>c.style.boxShadow='',1600);} }
  else if(a==='copy'){ const v=b.dataset.v; const done=()=>{ b.textContent='Kopiert'; setTimeout(()=>b.textContent='Kopieren',1400); };
    try{ navigator.clipboard.writeText(v).then(done,()=>{ const r=document.createRange(); r.selectNodeContents(b.previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Markiert – jetzt kopieren'); }); }catch{ toast(v); } }
  else if(a==='export') exportCsv();
  else if(a==='close-sheet') closeSheet(true);
  else if(a==='lightbox'){ ev.preventDefault(); $('#lb-img').src=b.dataset.src; $('#lightbox').hidden=false; }
  else if(a==='add-row'){
    const box=$(`[data-rows="${b.dataset.rows}"]`); const first=box.querySelector('.row');
    const n=first.cloneNode(true); n.querySelectorAll('input').forEach(i=>i.value=''); box.appendChild(n); n.querySelector('input').focus();
  }
  else if(a==='rm-row'){ const box=b.closest('.rows'); const row=b.closest('.row'); if(box.querySelectorAll('.row').length>1) row.remove(); else row.querySelectorAll('input').forEach(i=>i.value=''); }
  else if(a==='rm-file'){ ev.preventDefault(); ev.stopPropagation(); const i=+b.dataset.i; const f=formFiles.list.splice(i,1)[0]; if(f){ if(formFiles.added.includes(f.id)){ formFiles.added=formFiles.added.filter(x=>x!==f.id); try{await assets.delete(f.id);}catch{} } else formFiles.removed.push(f.id); } $('#ff-thumbs').innerHTML=fileThumbs(formFiles.list,true); }
  else if(a.startsWith('del-')){
    const key=a+id;
    if(!armed.has(key)){ armed.add(key); b.classList.add('armed'); b.textContent='Wirklich löschen?'; setTimeout(()=>{armed.delete(key); if(b.isConnected){b.classList.remove('armed'); b.textContent='Löschen';}},3500); return; }
    armed.delete(key);
    if(a==='del-plan'){
      const r=S.rooms.find(x=>x.id===S.inst.room);
      try{ await db.collection('rooms').doc(r.id).update({plans:(r.plans||[]).filter(x=>x.id!==id)}); try{ await assets.delete(id); }catch{} S.inst.plan=null; closeSheet(false); toast('Plan gelöscht'); }catch{ toast('Löschen fehlgeschlagen'); }
      return;
    }
    const coll={'del-entry':'entries','del-cost':'costs','del-room':'rooms','del-point':'install','del-event':'events','del-contact':'contacts','del-note':'notes'}[a];
    const item=find({entries:S.entries,costs:S.costs,install:S.points,rooms:S.rooms,events:S.events,contacts:S.contacts,notes:S.notes}[coll]);
    if(coll==='install') S.inst.sel=null;
    try{
      await db.collection(coll).doc(id).delete();
      if(assets&&item&&item.files) for(const f of item.files){ try{ await assets.delete(f.id); }catch{} }
      toast('Gelöscht');
    }catch(e){ toast('Löschen fehlgeschlagen'); }
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='ff-input') handleFiles(t);
  else if(t.id==='plan-input') uploadPlan(t);
  else if(t.id==='backup-input'){ const f=t.files[0]; t.value=''; if(f){ toast('Lade Backup …'); window.__offline.importBackup(f).then(n=>{ closeSheet(false); toast(n+' Datensätze übernommen'); }).catch(e=>toast('Backup ungültig: '+(e&&e.message||e))); } }
  else if(t.id==='n-room'){ S.nt.room=t.value; renderNoteList(); }
  else if(t.id==='qn-room'){ S.nt.qroom=t.value; }
  else if(t.id==='n-showdone'){ S.nt.showDone=t.checked; renderNoteList(); }
  else if(t.id==='ct-trade'){ S.ct.trade=t.value; renderContactList(); }
  else if(t.id==='i-room'){ S.inst.room=t.value; S.inst.plan=null; S.inst.sel=null; S.inst.placing=false; S.inst.move=null; renderInstall(); }
  else if(t.id==='f-room'||t.id==='f-cat'||t.id==='f-status'){ S.filter[{"f-room":'room','f-cat':'cat','f-status':'status'}[t.id]]=t.value; renderCosts(); }
});
document.addEventListener('input',ev=>{ if(ev.target.id==='ct-q'){ S.ct.q=ev.target.value; renderContactList(); } });
document.addEventListener('keydown',ev=>{ if(ev.target.id==='qn-text'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ ev.preventDefault(); addQuickNote(); } });
document.addEventListener('submit',async ev=>{
  if(ev.target.id==='qn-form'){ ev.preventDefault(); addQuickNote(); return; }
  if(ev.target.id!=='sheet-form') return;
  ev.preventDefault();
  const err=$('#f-err'), btn=$('#f-save'); err.hidden=true; btn.disabled=true; btn.textContent='Speichere …';
  try{ await sheetCtx.onSave(); closeSheet(false); }
  catch(e){ err.textContent = e&&e.code==='invalid_argument' ? 'Speichern nicht erlaubt – du hast für diese Seite nur Leserechte.' : e&&e.code==='quota_exceeded' ? 'Die Datenbank ist voll. Bitte alte Einträge löschen.' : (e&&e.message)||'Speichern fehlgeschlagen.'; err.hidden=false; btn.disabled=false; btn.textContent='Speichern'; }
});
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(true); });
$('#lightbox').addEventListener('click',()=>{ $('#lightbox').hidden=true; $('#lb-img').src=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#lightbox').hidden) $('#lightbox').click(); else if(!$('#overlay').hidden) closeSheet(true); } });
window.addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(TABS.includes(t)) setTab(t); });

/* ---------- Start ---------- */
async function start(){
  S.cal.sel=today(); S.cal.month=today().slice(0,7);
  render();
  const C=window.claude;
  if(!C||!C.use){ $('#status').innerHTML='<div class="banner">Speichern ist nur in der veröffentlichten Seite auf claude.ai möglich.</div>'; return; }
  [db,assets,downloads]=await Promise.all([C.use('db'),C.use('assets'),C.use('downloads')]);
  const user=await C.use('user');
  if(user&&user.can){ try{ const w=await user.can('data.write'); if(w===false) canWrite=false; }catch{} }
  if(!db){ $('#status').innerHTML='<div class="banner">Die Daten können in dieser Ansicht nicht geladen werden. Öffne die Seite angemeldet auf claude.ai.</div>'; render(); return; }
  if(window.__offline) $('#status').innerHTML='<div class="banner">Offline-Version: Alles wird nur in diesem Browser gespeichert. <button class="btn ghost small" data-act="edit-meta">Backup speichern</button></div>';
  const fail=e=>{ if(e&&e.code==='revoked') $('#status').innerHTML='<div class="banner">Zugriff auf die Daten wurde beendet.</div>'; };
  const sub=(coll,key,sort)=>db.collection(coll).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})); if(sort) S[key].sort(sort); S.loaded[key]=true; render(); },fail);
  sub('rooms','rooms',(a,b)=>(a.order||0)-(b.order||0));
  sub('entries','entries');
  sub('costs','costs');
  sub('notes','notes');
  sub('events','events',sortEv);
  sub('contacts','contacts');
  sub('install','points',(a,b)=>(a.createdAt||0)-(b.createdAt||0));
  db.doc('meta/projekt').onSnapshot(s=>{ S.meta=s.exists?s.data():{}; render(); },fail);
}
start();
})();
